version: 2
updates:
  - package-ecosystem: npm
    rebase-strategy: auto
    directory: /
    schedule:
      interval: daily
    groups:
      linter:
        applies-to: version-updates
        patterns:
          - "@tjsr/eslint-config"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
  - package-ecosystem: github-actions
    rebase-strategy: auto
    directory: /
    schedule:
      interval: weekly
