name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install required npm major
        run: npm install --global npm@12

      - name: Install dependencies
        # Node 22 is an explicit compatibility attempt below the package baseline.
        env:
          NPM_CONFIG_ENGINE_STRICT: ${{ matrix.node-version != 22 }}
        run: npm ci --allow-git=root

      - name: Run TypeScript compile
        run: npx tsc

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install required npm major
        run: npm install --global npm@12

      - name: Install dependencies
        # Node 22 is an explicit compatibility attempt below the package baseline.
        env:
          NPM_CONFIG_ENGINE_STRICT: ${{ matrix.node-version != 22 }}
        run: npm ci --allow-git=root

      - name: Run tests
        run: npm test -- --run
