name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci --strict-peer-deps --allow-git=all

      - name: Run TypeScript compile
        run: npx tsc

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci --strict-peer-deps --allow-git=all

      - name: Run tests
        run: npm test -- --run
