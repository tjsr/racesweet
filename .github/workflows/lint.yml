name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: TypeScript Lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install required npm major
        run: npm install --global npm@12

      - name: Install dependencies
        # Node 22 is an explicit compatibility attempt below the package baseline.
        env:
          NPM_CONFIG_ENGINE_STRICT: ${{ matrix.node-version != 22 }}
        run: npm ci --allow-git=all

      - name: Run TypeScript lint
        run: npm run lint:ts
